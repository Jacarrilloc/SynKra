apiVersion: apps/v1
kind: Deployment
metadata:
  name: synkra-front
  namespace: synkra
  labels:
    app.kubernetes.io/name: synkra-front
    app.kubernetes.io/part-of: synkra
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: synkra-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synkra-front
        app.kubernetes.io/part-of: synkra
    spec:
      automountServiceAccountToken: false # el front no habla con la API de Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synkra-front
          image: synkra-front # registro y etiqueta los pone el overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: Synkra__ApiUrl # Blazor Server llama a la API desde el servidor: por el Service, sin Ingress ni TLS
              value: http://synkra-backend.synkra.svc:8080/
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          # /app.css es un archivo estatico: responde sin llamar a la API, asi una API caida no reinicia el front.
          startupProbe:
            httpGet:
              path: /app.css
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /app.css
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /app.css
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # el runtime de .NET y ASP.NET escriben aqui (C-129)
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
