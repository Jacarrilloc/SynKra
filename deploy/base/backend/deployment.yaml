apiVersion: apps/v1
kind: Deployment
metadata:
  name: synkra-backend
  namespace: synkra
  labels:
    app.kubernetes.io/name: synkra-backend
    app.kubernetes.io/part-of: synkra
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate # RNF-07: un solo escritor de SQLite
  selector:
    matchLabels:
      app.kubernetes.io/name: synkra-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synkra-backend
        app.kubernetes.io/part-of: synkra
    spec:
      serviceAccountName: deployer
      automountServiceAccountToken: true # el backend habla con la API solo con este token
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synkra-backend
          image: synkra-backend # registro y etiqueta los pone el overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SYNKRA_DATA
              value: /data
            - name: SYNKRA_PAISES
              value: co,pe
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datos
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: synkra-datos
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
