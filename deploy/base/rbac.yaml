apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: synkra
  labels:
    app.kubernetes.io/part-of: synkra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synkra-deployer
  namespace: synkra-co
  labels:
    app.kubernetes.io/part-of: synkra
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["synkra-co"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synkra-deployer
  namespace: synkra-co
  labels:
    app.kubernetes.io/part-of: synkra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synkra-deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: synkra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synkra-deployer
  namespace: synkra-pe
  labels:
    app.kubernetes.io/part-of: synkra
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["synkra-pe"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synkra-deployer
  namespace: synkra-pe
  labels:
    app.kubernetes.io/part-of: synkra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: synkra-deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: synkra
