# Directorio de la base SQLite; SYNKRA_DATA lo sobrescribe (por defecto /data).
synkra.data=${SYNKRA_DATA:/data}

# Salud (H-24): solo /actuator/health, con sus componentes (db incluido).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# Límite del artefacto recibido (R-C5); SYNKRA_MAX_ARTEFACTO lo sobrescribe.
synkra.max-artefacto=${SYNKRA_MAX_ARTEFACTO:20MB}

# Tope de entradas de un JAR recibido (R-C6); SYNKRA_MAX_ENTRADAS_ARTEFACTO lo sobrescribe.
synkra.max-entradas-artefacto=${SYNKRA_MAX_ENTRADAS_ARTEFACTO:10000}

# Tope de bytes descomprimidos al revisar un JAR (anti bomba); SYNKRA_MAX_DESCOMPRIMIDO_ARTEFACTO lo sobrescribe.
synkra.max-descomprimido-artefacto=${SYNKRA_MAX_DESCOMPRIMIDO_ARTEFACTO:200MB}

# C-38: tope del cuerpo JSON de las rutas de /api/cores (y de la parte etiquetas de una subida).
synkra.max-cuerpo-json=${SYNKRA_MAX_CUERPO_JSON:64KB}

# Multipart (H-02): ConfiguracionMultipart fija max-file-size y max-request-size por encima de synkra.max-artefacto,
# para que el 413 de un JAR grande venga de R-C5. Con file-size-threshold=0, Tomcat escribe cada parte en su
# directorio temporal (java.io.tmpdir/tomcat.*), no en synkra.data; Spring lo borra al terminar la petición.

# R-C3 (H-31): registro de imágenes permitido (host[:puerto]); vacío = sin restricción.
# SYNKRA_REGISTRO_PERMITIDO lo sobrescribe. Un valor inválido hace fallar el arranque.
synkra.registro-permitido=${SYNKRA_REGISTRO_PERMITIDO:}

# U05-T03: imagen del init container de los pods de país (registro con punto, puerto o localhost, y tag o digest;
# nunca :latest). Sin valor, el defecto vive solo en ConstructorObjetosPais.IMAGEN_INIT_POR_DEFECTO.
# Se sobrescribe con SYNKRA_KUBERNETES_IMAGEN_INIT. Un valor inválido hace fallar el arranque.

# R-D1 y R-R7: países permitidos (dos letras en minúscula, separados por comas); SYNKRA_PAISES lo sobrescribe; inválido = no arranca.
synkra.paises=${SYNKRA_PAISES:co,pe}

# U07-E: las tareas programadas (vigilancia y barrido de planes) corren; las pruebas lo apagan en config/application.properties.
synkra.programacion.activa=true

# R-D10: cada cuánto se revisan los despliegues aplicando (ISO-8601); SYNKRA_VIGILANCIA_INTERVALO lo sobrescribe.
synkra.vigilancia.intervalo=${SYNKRA_VIGILANCIA_INTERVALO:PT5S}

# R-D10: plazo desde confirmado_en para que un despliegue quede listo; SYNKRA_VIGILANCIA_PLAZO lo sobrescribe.
synkra.vigilancia.plazo=${SYNKRA_VIGILANCIA_PLAZO:PT3M}

# C-109: cada cuánto se vencen los planes pendientes cuyo vence_en llegó; SYNKRA_PLANES_BARRIDO lo sobrescribe.
synkra.planes.barrido=${SYNKRA_PLANES_BARRIDO:PT1M}
