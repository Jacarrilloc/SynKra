# Escrito a mano a partir de U08 (infrastructure-design), no generado por el código.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synkra-core-config
  namespace: synkra-pe
  labels:
    app.kubernetes.io/managed-by: synkra
data:
  plugins-activos.yaml: |
    plugins:
      - nombre: facturacion
        version: 1.2.0
      - nombre: impuestos
        version: 2.0.1
  artefactos.txt: |
    1111111111111111111111111111111111111111111111111111111111111111 facturacion-1.2.0.jar
    2222222222222222222222222222222222222222222222222222222222222222 impuestos-2.0.1.jar
---
apiVersion: v1
kind: Service
metadata:
  name: synkra-core
  namespace: synkra-pe
  labels:
    app.kubernetes.io/managed-by: synkra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: synkra-core
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synkra-core
  namespace: synkra-pe
  labels:
    app.kubernetes.io/managed-by: synkra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synkra-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synkra-core
        app.kubernetes.io/managed-by: synkra
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: descarga
          image: synkra-init-descarga
          command: ["/usr/local/bin/descargar.sh"]
          env:
            - name: SYNKRA_URL
              value: http://synkra-backend.synkra.svc:8080
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: config
              mountPath: /config
      containers:
        - name: core
          image: localhost:5001/core-pe@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: config
              mountPath: /config
      volumes:
        - name: plugins
          emptyDir: {}
        - name: config
          configMap:
            name: synkra-core-config
